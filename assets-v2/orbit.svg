<text x="0" y="-2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e6e9f5">Clean</text>
<text x="0" y="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e6e9f5">Architecture</text>
</g>
</g>
</g>

<g>
<animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="34s" repeatCount="indefinite"/>
