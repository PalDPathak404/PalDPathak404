<circle r="56" fill="#0b1229" stroke="url(#nodeG)" stroke-width="2.5"/>
<text x="0" y="-4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#f5f7ff">React</text>
<text x="0" y="16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa5c9">/ TypeScript</text>

<g>
<animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="34s" repeatCount="indefinite"/>
