<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="ctrGlow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
<stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
</radialGradient>
<linearGradient id="nodeG" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
<radialGradient id="bgv" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#0b1229"/><stop offset="1" stop-color="#050814"/></radialGradient>
</defs>
<rect width="1200" height="420" rx="20" fill="url(#bgv)"/>
<rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#1b2542" stroke-width="1.5"/>

<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="40" y="46" font-size="13" letter-spacing="5" fill="#2dd4bf" font-weight="700">FOCUS AREAS</text>
</g>

<g transform="translate(600,235)">
