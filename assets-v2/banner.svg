<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#050814"/>
<stop offset="0.5" stop-color="#0b1229"/>
<stop offset="1" stop-color="#0f1b2e"/>
</linearGradient>
<linearGradient id="accent" x1="0" x2="1">
<stop offset="0" stop-color="#2dd4bf"/>
<stop offset="1" stop-color="#6366f1"/>
</linearGradient>
<linearGradient id="stripe" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#6366f1" stop-opacity="0.9"/>
<stop offset="1" stop-color="#2dd4bf" stop-opacity="0.9"/>
</linearGradient>
<radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
<stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
<stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
</radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>

<rect width="1200" height="320" rx="22" fill="url(#bg)"/>

<circle cx="140" cy="270" r="160" fill="url(#glow2)"><animate attributeName="cx" values="140;180;140" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="1060" cy="50" r="180" fill="url(#glow1)"><animate attributeName="cx" values="1060;1010;1060" dur="10s" repeatCount="indefinite"/></circle>

<polygon points="0,0 90,0 40,320 0,320" fill="url(#stripe)" opacity="0.13"/>
<polygon points="1200,320 1130,320 1170,0 1200,0" fill="url(#stripe)" opacity="0.13"/>

<g stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1">
<line x1="0" y1="40" x2="1200" y2="40"/>
<line x1="0" y1="280" x2="1200" y2="280"/>
</g>

<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="90" y="95" font-size="15" letter-spacing="7" fill="#2dd4bf" font-weight="700">PORTFOLIO / FRONTEND ENGINEER</text>
<text x="90" y="158" font-size="56" font-weight="800" fill="#f5f7ff" letter-spacing="0.5">Pal D Pathak</text>
<rect x="90" y="176" width="0" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" values="0;220" dur="1.4s" fill="freeze"/></rect>
<text x="90" y="215" font-size="19" fill="#9aa5c9" font-weight="500">Building responsive, high-performance web applications</text>
</g>

<g font-family="Consolas, Menlo, monospace" font-size="14">
<rect x="740" y="70" width="380" height="180" rx="12" fill="#0a1024" stroke="#22304f" stroke-width="1.4"/>
<circle cx="762" cy="92" r="5" fill="#ef4444"/>
<circle cx="781" cy="92" r="5" fill="#f5b544"/>
<circle cx="800" cy="92" r="5" fill="#2dd4bf"/>
<text x="825" y="97" font-size="12" fill="#5b6a94">portfolio.ts</text>
<line x1="740" y1="110" x2="1120" y2="110" stroke="#1b2542" stroke-width="1"/>

<text x="758" y="136" fill="#6366f1">const</text>
<text x="806" y="136" fill="#f5f7ff">engineer = {</text>
<text x="772" y="158" fill="#2dd4bf">name</text><text x="812" y="158" fill="#9aa5c9">: 'Pal D Pathak',</text>
<text x="772" y="180" fill="#2dd4bf">stack</text><text x="820" y="180" fill="#9aa5c9">: ['React','TS'],</text>
<text x="772" y="202" fill="#2dd4bf">seeking</text><text x="840" y="202" fill="#9aa5c9">: 'Frontend Intern'</text>
<text x="758" y="224" fill="#f5f7ff">};</text>
<rect x="758" y="212" width="9" height="16" fill="#2dd4bf">
<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</g>

<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="90" y="260" font-size="15" fill="#2dd4bf" letter-spacing="3">REACT</text>
<text x="165" y="260" font-size="15" fill="#4b5a80">/</text>
<text x="185" y="260" font-size="15" fill="#2dd4bf" letter-spacing="3">TYPESCRIPT</text>
<text x="320" y="260" font-size="15" fill="#4b5a80">/</text>
<text x="340" y="260" font-size="15" fill="#2dd4bf" letter-spacing="3">JAVASCRIPT</text>
</g>

<rect x="1.5" y="1.5" width="1197" height="317" rx="21" fill="none" stroke="#22304f" stroke-width="1.5"/>
</svg>
